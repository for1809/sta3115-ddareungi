<h2>언덕 위는 하루 동안 자전거가 빠져나간다</h2>
<div class="body">
<div class="figcard"><img src="/_blob/2ee38ef37670c9665ecbda91a6b1a3c5" alt="대여소 고도와 평일 하루 순변화(반납 빼기 대여)의 LOESS. 고도 30m 위부터 0 아래로 내려간다." style="width:1071px;height:600px;object-fit:contain"></div>
<div class="side">
<p class="note">순변화 = 반납 - 대여. 0보다 아래면 하루 동안 자전거가 빠져나가는 대여소다.</p>
<p class="note">고도 30m 위부터 0 아래로 내려간다. 내려갈 때는 타고, 올라올 때는 덜 탄다는 뜻으로 읽힌다.</p>
</div>
</div>
<div class="foot"><p class="foot-l">STA3115 탐색적자료분석 1조</p><p class="foot-r"></p></div>
<aside>왜 언덕 위가 비는지에 대한 그림입니다. 하루 동안 반납에서 대여를 뺀 순변화가 고도 30m 위부터 0 아래로 내려갑니다. 언덕 위에서는 빌려 가는 자전거가 돌아오는 자전거보다 많다는 뜻입니다.</aside>
