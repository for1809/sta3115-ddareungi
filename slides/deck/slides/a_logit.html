<h2>로지스틱 회귀의 예측 확률</h2>
<div class="body">
<div class="figcard"><img src="/_blob/b89a7288253bc0382e67f64265744838" alt="고도에 따른 품절이 잦을 확률의 예측 곡선. 역까지 200m인 대여소의 곡선이 800m인 곳보다 40m 위에서 더 가파르다." style="width:1100px;height:550px;object-fit:contain"></div>
<div class="side">
<p class="note">고도 40m를 넘으면 확률이 빠르게 오르고, 역까지 200m인 대여소에서 더 가파르다.</p>
<p class="note muted">고도와 역 거리의 상호작용을 넣은 모형. 대학 거리와 거치대 수는 중앙값으로 고정했다.</p>
</div>
