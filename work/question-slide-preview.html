<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — Research question</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
* { margin: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0b0d10; overflow: hidden; }
body { font: 32px/1.2 'Inter', 'Noto Sans KR', 'Segoe UI', Arial, sans-serif; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
#stage > section { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; display: none; isolation: isolate; }
#stage > section.on { display: flex; }
aside { display: none !important; }
h1 { font-size: 96px; font-weight: 600; } h2 { font-size: 64px; font-weight: 600; } h3 { font-size: 44px; font-weight: 600; }
p, li, h1, h2, h3, td, th { overflow-wrap: break-word; text-wrap: pretty; }
table { width: 100%; border-collapse: separate; border-spacing: 0; border: solid #0003; border-width: 2px 0 0 2px; }
th, td { padding: .35em .6em; text-align: left; border: solid #0003; border-width: 0 2px 2px 0; }
.cover-hill { z-index: -1; }
</style>
<style>/* Toss-like look: white canvas, light blue rounded surfaces, big bold numbers, one blue accent.
   Red is kept for shortage, the same red as in the figures. */
:root {
  --bg: #FFFFFF;
  --bg2: #F4F8FF;
  --tint: #F4F8FF;
  --ink: #191F28;
  --ink2: #333D4B;
  --muted: #6B7684;
  --line: #E5E8EB;
  --red: #F04452;
  --blue: #3182F6;
  --blue-bg: #E8F3FF;
  --card: #FFFFFF;
  --on-blue: #FFFFFF;
  --on-blue-muted: #C9E2FF;
}

body { font-family: 'Inter', 'Noto Sans KR', 'Segoe UI', Arial, sans-serif; color: var(--ink); }

section {
  box-sizing: border-box;
  padding: 128px 128px 160px;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  counter-increment: page;
}
section.dark { background: var(--card); color: var(--ink); padding: 128px; }
section.accent { background: var(--blue); color: var(--on-blue); padding: 128px; }
section.alt { background: var(--bg); }

h1, h2, h3 { font-family: 'Inter', 'Noto Sans KR', 'Segoe UI', Arial, sans-serif; margin: 0; letter-spacing: -1.5px; color: inherit; }
h1 { font-size: 104px; font-weight: 700; line-height: 1.12; }
h2 { font-size: 56px; font-weight: 700; line-height: 1.22; }
h3 { font-size: 36px; font-weight: 700; line-height: 1.3; }

.eyebrow { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; color: var(--blue); margin: 0 0 16px; }
.accent .eyebrow { color: var(--on-blue-muted); }

/* figure slides: heading, then a figure card with a side card */
.body { display: flex; gap: 32px; align-items: stretch; margin-top: 40px; }
.figcard { background: var(--card); padding: 20px 0; }
.figcard img { display: block; object-fit: contain; }
.side { display: flex; flex-direction: column; gap: 28px; flex: 1; padding: 20px 0 0 32px; border-left: 3px solid var(--blue-bg); }
.stat { display: flex; flex-direction: column; }
.stat-num { font-size: 56px; font-weight: 700; line-height: 1.1; letter-spacing: -1.5px; color: var(--red); margin: 0; font-variant-numeric: tabular-nums; }
.stat-num.blue { color: var(--blue); }
.stat-num.ink { color: var(--ink); }
.stat-lab { font-size: 24px; line-height: 1.45; color: var(--muted); margin: 8px 0 0; }
.note { font-size: 28px; line-height: 1.5; color: var(--ink2); margin: 0; }
.note.muted { color: var(--muted); }
.side hr { border: none; border-top: 2px solid var(--line); margin: 0; }

/* text slides */
.lead { font-size: 38px; font-weight: 600; line-height: 1.42; letter-spacing: -0.5px; margin: 0; color: var(--ink); }
.text { font-size: 28px; line-height: 1.55; color: var(--ink2); margin: 0; }
.text.muted { color: var(--muted); }
.cols { display: flex; gap: 32px; margin-top: 48px; }
.col { display: flex; flex-direction: column; gap: 24px; flex: 1; background: var(--tint); border-radius: 28px; padding: 48px; }
.card { background: var(--tint); border-radius: 28px; padding: 44px; display: flex; flex-direction: column; gap: 20px; flex: 1; }
.card-title { font-size: 36px; font-weight: 700; line-height: 1.3; letter-spacing: -0.5px; margin: 0; }
.card-body { font-size: 28px; line-height: 1.5; margin: 0; color: var(--ink2); }
.card-small { font-size: 24px; line-height: 1.45; margin: 0; color: var(--muted); }
.big { font-size: 96px; font-weight: 700; line-height: 1.1; letter-spacing: -2.5px; margin: 0; color: var(--red); font-variant-numeric: tabular-nums; }
.big.ink { color: var(--ink); }
.big-lab { font-size: 28px; line-height: 1.4; margin: 8px 0 0; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 48px; }
.app-list { font-size: 32px; line-height: 1.6; color: var(--ink2); margin: 48px 0 0; }

/* tables: white card, hairlines only between rows */
table.tbl { font-size: 28px; color: var(--ink); width: 100%; background: var(--card); border: none; border-radius: 28px; overflow: hidden; border-spacing: 0; }
.tbl th, .tbl td { border: none; border-bottom: 1px solid var(--line); padding: .55em .8em; font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: none; }
.tbl th { color: var(--muted); font-weight: 600; font-size: .86em; }
.tbl.small { font-size: 26px; }
.side .tbl { border-radius: 16px; box-shadow: 0 0 0 1px var(--line); }
section:not(.accent) > table.tbl, .body > div > table.tbl { box-shadow: 0 0 0 1px var(--line); }
.hl td { background: var(--blue-bg); color: var(--ink); font-weight: 700; }

/* statement slides */
.qlist { display: flex; flex-direction: column; gap: 24px; margin-top: 56px; }
.q { display: flex; gap: 32px; align-items: center; background: var(--tint); border-radius: 28px; padding: 24px 40px; }
.q-num { font-size: 44px; font-weight: 700; color: var(--blue); margin: 0; width: 56px; font-variant-numeric: tabular-nums; }
.q-text { font-size: 44px; font-weight: 700; line-height: 1.25; letter-spacing: -0.5px; margin: 0; color: var(--ink); }
.take { display: flex; flex-direction: column; gap: 28px; margin-top: 56px; }
.take-line { font-size: 36px; line-height: 1.4; margin: 0; }
.take-line.soft { color: var(--muted); }
.accent .take-line.soft { color: var(--on-blue-muted); }
.accent .take-line b { display: block; background: var(--card); color: var(--ink); border-radius: 28px; padding: 32px 40px; margin-top: 8px; }

/* footer band */
.foot { position: absolute; left: 128px; bottom: 64px; width: 1664px; display: flex; justify-content: space-between; }
.foot-l { font-size: 24px; color: var(--muted); margin: 0; }
.foot-r { font-size: 24px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.foot-r::before { content: counter(page); }

/* cover */
.cover-hill { position: absolute; left: 0; top: 640px; width: 1920px; height: 440px; }
.kicker { font-size: 36px; font-weight: 600; color: var(--blue); margin: 40px 0 16px; }
.byline { font-size: 28px; color: var(--muted); margin: 48px 0 0; }

/* motion: things arrive within about a second */
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.figcard { animation: fade-in 500ms ease-out both; }
.side { animation: rise-in 500ms ease-out 250ms both; }
.qlist, .take { animation: rise-in 600ms ease-out 200ms both; }
</style>
<style>
#notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38vh; overflow: auto; display: none;
  background: rgba(20, 24, 30, .94); color: #f2f4f6; font: 18px/1.55 'Inter', 'Segoe UI', sans-serif; padding: 18px 28px 22px; }
#notes.on { display: block; }
#notes b { color: #90c2ff; font-weight: 600; margin-right: 8px; }
#notes .cue { color: #ffd76a; display: block; margin-bottom: 6px; }
#hint { position: fixed; right: 14px; bottom: 10px; color: #8b95a1; font: 13px 'Segoe UI', sans-serif; opacity: .8;
  animation: hint-out 800ms ease-in 5s forwards; }
@keyframes hint-out { to { opacity: 0; } }
#notes.on ~ #hint { display: none; }
</style>
<style>
/* additions for the new deck */
#stage input[type=range] { accent-color: #3182F6; }
.figcard { position: relative; }
.side.rowstats { position: absolute; left: 128px; top: 848px; flex-direction: row; gap: 48px; border: none; padding: 0; flex: none; }
.rowstats .stat { width: 520px; }
.rowstats .stat-num { font-size: 42px; }
.rowstats .stat-lab { font-size: 21px; }
.compact .qlist { gap: 18px; margin-top: 40px; }
.compact .q { padding: 18px 36px; }
.compact .q-text { font-size: 34px; }
.wideq .q-num { width: 90px; }
</style></head><body><div id="stage"><section class="on" id="question-preview" style="counter-reset:page 2">
<p class="eyebrow">OUR QUESTION</p>
<div style="flex:1;display:flex;align-items:center;padding:20px 0 44px">
<h2 style="font-size:76px;line-height:1.25;letter-spacing:-1.8px;margin:0;max-width:1640px">What station characteristics are associated with <span style="color:var(--blue)">persistent bicycle imbalances,</span><br>and why do some stations experience <span style="color:var(--blue)">shortages?</span></h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:64px;background:var(--tint);border-radius:24px;padding:30px 44px;margin-bottom:36px">
<div><p style="font-size:23px;color:var(--muted);margin:0 0 10px">Annual rides · 2023 → 2025</p><p style="font-size:42px;font-weight:700;color:var(--ink);margin:0">44.9M → 37.4M</p></div>
<div><p style="font-size:23px;color:var(--muted);margin:0 0 10px">Operating deficit · 2022 → 2025</p><p style="font-size:42px;font-weight:700;color:var(--ink);margin:0">₩9.4 bn → ₩17.6 bn</p></div>
</div>
<div class="foot"><p class="foot-l">STA3115 Exploratory Data Analysis, Group 1</p><p class="foot-r"></p></div>
</section></div><script>
function fitPreview() {
const scale=Math.min(innerWidth/1920,innerHeight/1080);
document.getElementById('stage').style.transform=`scale(${scale}) translate(-50%, -50%)`;
}
addEventListener('resize',fitPreview);fitPreview();
</script></body></html>
